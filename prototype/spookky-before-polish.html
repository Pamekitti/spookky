function getFiles(c=checkout()){if(!c)return [];if(c.fixture==='plain')return [{...fixtureFiles.find(f=>f.id==='readme'),name:'notes.md',rows:[['same',1,1,'# Notes'],['same',2,2,'Ideas for the next session.']]}];if(c.fixture==='empty')return [{...fixtureFiles.find(f=>f.id==='readme'),change:'untracked',kind:'added',plus:2,minus:0}];if(c.fixture==='clean')return fixtureFiles.filter(f=>!['delete','conflict'].includes(f.id)).map(f=>({...f,change:null,kind:['binary','large'].includes(f.kind)?f.kind:'unchanged'}));return fixtureFiles}

function renderSidebar(){let groups=state.projects.map(p=>({id:p.id,name:p.name}));groups.push({id:null,name:'No project'});find('#project-list').innerHTML=groups.map(p=>{const ws=state.workspaces.filter(w=>(checkout(w)?.projectId||w.draft?.projectId||null)===p.id);if(!p.id&&!ws.length)return '';return `<div class="project-row">${button('project-nav',`<span class="project-mark">${safe(p.name[0].toUpperCase())}</span><span class="project-name">${safe(p.name)}</span>`,`class="project" data-id="${p.id||''}" aria-label="Project ${safe(p.name)}" data-tooltip="${safe(p.name)}"`)}${p.id?iconButton('project-menu','ellipsis',`Options for ${p.name}`,`data-id="${p.id}" class="icon row-menu"`):''}</div>`+ws.map(w=>{const c=checkout(w),active=w.id===state.activeId,live=w.tabs.some(running);return `<div class="workspace-row">${button('workspace',`<span class="rail-session-icon">${icon(c?'terminal':'plus')}</span><span class="workspace-info"><span class="workspace-name">${safe(w.name)}</span><span class="workspace-branch">${safe(c?(c.branch||c.path):'Choose a location or start in Home')}</span></span>${live?'<span class="status-dot working"></span>':''}`,`class="workspace ${active?'active':''}" data-id="${w.id}" aria-label="${safe(w.name)}" aria-current="${active?'page':'false'}" data-tooltip="${safe(w.name)}"`)}${iconButton('workspace-menu','ellipsis',`Options for workspace ${w.name}`,`data-id="${w.id}" class="icon row-menu"`)}</div>`}).join('')}).join('');find('.sidebar-controls button').setAttribute('aria-expanded',state.ui.nav)}
