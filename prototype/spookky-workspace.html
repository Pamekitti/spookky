<style>
#spookky-app {
  --bg:light-dark(#faf9f8,#151312); --surface:light-dark(#f3f2f0,#1b1918);
  --raised:light-dark(#ecebe8,#24211f); --hover:light-dark(#e7e5e2,#2b2826);
  --selected:light-dark(#e1dfdb,#302d2a); --text:light-dark(#252321,#e8e5e1);
  --muted:light-dark(#68635e,#aca6a0); --faint:light-dark(#706a65,#8d8680);
  --line:light-dark(#dedbd6,#302c29); --green:light-dark(#267a4a,#78bf91);
  --red:light-dark(#b14646,#db8581); --amber:light-dark(#966500,#dbb069);
  --blue:light-dark(#266e9c,#88afd6); --add:light-dark(#e6f0e8,#203127);
  --del:light-dark(#f7e7e5,#382725); --shadow:light-dark(#221a121a,#0006);
  color-scheme:dark; color:var(--text); background:var(--bg); border:1px solid var(--line);
  border-radius:10px; overflow:hidden; font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  min-width:0; position:relative; text-align:left; -webkit-font-smoothing:antialiased;
}
#spookky-app * {box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
#spookky-app button,#spookky-app input,#spookky-app textarea,#spookky-app select {font:inherit;color:inherit}
#spookky-app button {border:0;background:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:6px 10px;border-radius:6px;white-space:nowrap}
#spookky-app button:hover,#spookky-app summary:hover {background:var(--hover)}
#spookky-app :is(button,summary,input,textarea,select):focus-visible {outline:2px solid var(--blue);outline-offset:-2px}
#spookky-app button:disabled {opacity:.4;cursor:not-allowed}
#spookky-app svg {width:16px;height:16px;stroke-width:1.65;flex:none}
#spookky-app .icon {height:28px;width:28px;padding:6px;color:var(--muted);flex:none}
#spookky-app .icon:hover {color:var(--text)}
#spookky-app .muted,#spookky-app .hint {color:var(--muted)}
#spookky-app .faint {color:var(--faint)}
#spookky-app .green {color:var(--green)}
#spookky-app .red {color:var(--red)}
#spookky-app .amber {color:var(--amber)}
#spookky-app .spacer {flex:1;min-width:0}
#spookky-app .count {font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
#spookky-app .frame {display:grid;grid-template-columns:232px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:760px}
#spookky-app .project-sidebar {border-right:1px solid var(--line);background:var(--surface);min-width:0;min-height:0;display:flex;flex-direction:column;padding:0 8px 8px;overflow:hidden}
#spookky-app .sidebar-controls {display:flex;align-items:center;justify-content:flex-end;height:40px;flex:none;padding:0 2px;margin-bottom:8px}
#spookky-app .navigation {width:100%;height:34px;justify-content:flex-start;gap:10px;padding:7px 10px;color:var(--muted);text-align:left;flex:none}
#spookky-app .navigation.strong {color:var(--text);background:var(--raised);margin-bottom:4px}
#spookky-app .shortcut {margin-left:auto;color:var(--faint);font-size:11px}
#spookky-app .sidebar-label {display:flex;align-items:center;padding:16px 8px 4px;color:var(--faint);font-size:11px;letter-spacing:.6px;text-transform:uppercase;flex:none}
#spookky-app #project-list {overflow:auto;min-height:0;flex:1;padding:0 2px 12px}
#spookky-app .project-group {margin-top:8px}
#spookky-app .project-row,#spookky-app .workspace-row {display:flex;align-items:center;min-width:0;border-radius:6px;position:relative}
#spookky-app .project-row {height:32px}
#spookky-app .project-row:hover,#spookky-app .workspace-row:hover {background:var(--raised)}
#spookky-app .project-row>.project,#spookky-app .workspace-row>.workspace {min-width:0;flex:1;justify-content:flex-start;text-align:left;background:none}
#spookky-app .project {height:32px;padding:4px 8px;gap:8px;font-weight:500}
#spookky-app .project-mark {display:grid;place-items:center;width:20px;height:20px;border-radius:5px;background:var(--raised);color:var(--muted);font-size:11px;flex:none}
#spookky-app .project-mark svg {width:14px;height:14px}
#spookky-app .project-mark {width:16px;height:16px;position:relative}
#spookky-app .project-disclosure {display:none}
#spookky-app .project-row:is(:hover,:focus-within) .project-identity {display:none}
#spookky-app .project-row:is(:hover,:focus-within) .project-disclosure {display:grid}
#spookky-app.nav-hidden .project-row .project-identity {display:grid}
#spookky-app.nav-hidden .project-disclosure {display:none}
#spookky-app .project-name {overflow:hidden;text-overflow:ellipsis}
#spookky-app .row-action {width:28px;height:28px;margin-right:4px;color:var(--faint);visibility:hidden}
#spookky-app :is(.project-row,.workspace-row):is(:hover,:focus-within) .row-action {visibility:visible}
#spookky-app :is(.row-action,[data-action="close-tab"],[data-action="add-terminal"],[data-action="add-project"]) {position:relative;background:none;padding:0}
#spookky-app :is(.row-action,[data-action="close-tab"],[data-action="add-terminal"],[data-action="add-project"])::before {content:"";position:absolute;width:20px;height:20px;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:5px}
#spookky-app :is(.row-action,[data-action="close-tab"],[data-action="add-terminal"],[data-action="add-project"]):hover {background:none}
#spookky-app :is(.row-action,[data-action="close-tab"],[data-action="add-terminal"],[data-action="add-project"]):hover::before {background:var(--hover)}
#spookky-app :is(.row-action,[data-action="close-tab"],[data-action="add-terminal"],[data-action="add-project"]) svg {position:relative;width:12px!important;height:12px!important}
#spookky-app [data-action="close-tab"] {visibility:hidden;width:24px;height:24px;align-self:center}
#spookky-app .tab-pair:is(:hover,:focus-within) [data-action="close-tab"] {visibility:visible}

#spookky-app .workspace-row {margin:2px 0 2px 12px}
#spookky-app .workspace-row.active {background:var(--selected)}
#spookky-app .workspace {height:46px;padding:6px 8px;gap:8px;color:var(--muted)}
#spookky-app .workspace.active {color:var(--text)}
#spookky-app .workspace-info {display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
#spookky-app .workspace-name {font-size:12px;overflow:hidden;white-space:nowrap}
#spookky-app .workspace-name[data-overflow="true"] {mask-image:linear-gradient(to right,black calc(100% - 14px),transparent)}
#spookky-app .title-text {display:inline-block;transition:transform .2s ease}
#spookky-app .workspace-row:is(:hover,:focus-within) .workspace-name[data-overflow="true"] {mask-image:none}
#spookky-app .workspace-row:is(:hover,:focus-within) .title-text {transform:translateX(calc(-1px * var(--overflow,0)));transition:transform var(--duration,.5s) linear .35s}
@media (prefers-reduced-motion:reduce) {
 #spookky-app .workspace-row:is(:hover,:focus-within) .title-text {transform:none;transition:none}
 #spookky-app .workspace-row:is(:hover,:focus-within) .workspace-name[data-overflow="true"] {mask-image:linear-gradient(to right,black calc(100% - 14px),transparent)}
}
#spookky-app .workspace-branch {font-size:11px;color:var(--faint);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#spookky-app .rail-session-icon {display:flex;align-items:center;color:var(--faint);flex:none}
#spookky-app .rail-session-icon svg {width:14px;height:14px}
#spookky-app .status-dot {width:5px;height:5px;border-radius:50%;background:var(--faint);flex:none}
#spookky-app .status-dot.working {background:var(--amber)}
#spookky-app .status-dot.ready {background:var(--green)}
#spookky-app .sidebar-footer {display:flex;align-items:center;gap:8px;margin-top:auto;padding:8px 4px 0;border-top:1px solid var(--line);color:var(--muted);font-size:12px;flex:none}
#spookky-app .avatar {display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--raised);font-size:11px}
#spookky-app.nav-hidden .frame {grid-template-columns:58px minmax(0,1fr)}
#spookky-app.nav-hidden .project-sidebar {padding:0 6px 8px}
#spookky-app.nav-hidden .sidebar-controls {justify-content:center}
#spookky-app.nav-hidden .navigation {width:40px;height:36px;margin:2px auto;justify-content:center;padding:8px}
#spookky-app.nav-hidden :is(.nav-label,.shortcut,.workspace-info,.project-name,.footer-name,.row-action) {display:none}
#spookky-app.nav-hidden .sidebar-label {font-size:0;padding:12px 0 4px;justify-content:center}
#spookky-app.nav-hidden .sidebar-label .spacer {display:none}
#spookky-app.nav-hidden #project-list {padding:0;scrollbar-width:none}
#spookky-app.nav-hidden .project-group {margin-top:6px}
#spookky-app.nav-hidden .project-row {height:34px}
#spookky-app.nav-hidden .project {justify-content:center;padding:6px}
#spookky-app.nav-hidden .workspace-row {margin:2px 0}
#spookky-app.nav-hidden .workspace {height:34px;justify-content:center;padding:8px}
#spookky-app.nav-hidden .workspace .status-dot {position:absolute;right:6px;top:6px}
#spookky-app.nav-hidden .sidebar-footer {flex-direction:column;gap:8px;padding-top:10px}
#spookky-app.nav-hidden .sidebar-footer .spacer {display:none}
#spookky-app .workspace-shell {min-width:0;min-height:0;display:flex;flex-direction:column}
#spookky-app .agent-strip {height:40px;min-height:40px;display:flex;align-items:center;gap:4px;padding:0 6px;border-bottom:1px solid var(--line);background:var(--surface);min-width:0;flex:none}
#spookky-app .tab-scroll {display:flex;align-self:stretch;min-width:0;max-width:calc(100% - 72px);overflow:auto;scrollbar-width:none}
#spookky-app .tab-pair {display:flex;align-items:center;flex:none;border:1px solid transparent;border-bottom:0;border-radius:7px 7px 0 0;margin-top:4px;padding-right:4px;max-width:204px}
#spookky-app .tab-pair.active {background:var(--bg);border-color:var(--line);position:relative}
#spookky-app .tab-pair.active::after {content:"";position:absolute;bottom:-1px;left:0;right:0;height:1px;background:var(--bg)}
#spookky-app .session-tab {height:34px;min-width:80px;max-width:172px;font-size:12px;padding:6px 10px;color:var(--muted);background:none}
#spookky-app .session-tab.active {color:var(--text)}
#spookky-app .session-tab>span:not(.status-dot) {overflow:hidden;text-overflow:ellipsis}
#spookky-app .session-tab svg {width:14px;height:14px}
#spookky-app .tab-pair>.icon {width:24px;height:24px;padding:5px;color:var(--faint)}
#spookky-app .agent-strip>[aria-expanded="true"] {color:var(--text);background:var(--raised)}
#spookky-app .workspace-grid {display:grid;grid-template-columns:minmax(0,1fr) 248px;flex:1;min-width:0;min-height:0;overflow:hidden}
#spookky-app.side-hidden .workspace-grid {grid-template-columns:minmax(0,1fr)}
#spookky-app.side-hidden .files-sidebar {display:none}
#spookky-app .core {display:grid;grid-template-columns:minmax(0,48%) 6px minmax(0,1fr);min-width:0;min-height:0}
#spookky-app .core.no-diff,#spookky-app .core.max-diff {grid-template-columns:minmax(0,1fr)}
#spookky-app .core.no-diff :is(.resizer,.diff-pane),#spookky-app .core.max-diff :is(.terminal-pane,.resizer) {display:none}
#spookky-app .resizer {padding:0;width:6px;border-radius:0;background:var(--bg);border-left:1px solid var(--line);cursor:col-resize}
#spookky-app .resizer:hover,#spookky-app .resizer:focus-visible {background:var(--selected)}
#spookky-app .terminal-pane,#spookky-app .diff-pane,#spookky-app .files-sidebar {min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
#spookky-app .pane-head {height:36px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px 0 12px;background:var(--bg);border-bottom:1px solid var(--line);color:var(--muted)}
#spookky-app .pane-title {display:flex;align-items:center;gap:7px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12px}
#spookky-app .pane-title strong {font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis}
#spookky-app .pane-title svg {width:14px;height:14px}
#spookky-app .pane-head .count {margin-right:4px;flex:none}
#spookky-app .terminal-split {display:flex;flex:1;min-width:0;min-height:0;overflow:hidden}
#spookky-app .terminal-instance {display:flex;flex-direction:column;min-width:0;flex:1;overflow:hidden}
#spookky-app .terminal-instance+.terminal-instance {border-left:1px solid var(--line)}
#spookky-app .terminal-content {display:flex;flex-direction:column;flex:1;min-width:0;min-height:0;overflow:hidden;padding:18px 18px 12px;font:var(--terminal-size,13px)/1.65 ui-monospace,SFMono-Regular,Consolas,monospace}
#spookky-app .terminal-lines {flex:1;min-height:0;min-width:0;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
#spookky-app .terminal-entry {margin-bottom:20px;white-space:pre-wrap;overflow-wrap:anywhere}
#spookky-app .terminal-entry strong {font-weight:500}
#spookky-app .terminal-prompt {display:flex;align-items:flex-start;gap:8px;border-top:1px solid var(--line);padding-top:12px}
#spookky-app .terminal-prompt>span {color:var(--amber)}
#spookky-app .terminal-prompt textarea {width:100%;min-width:0;height:42px;max-height:100px;resize:vertical;border:0;background:none;padding:0;font:inherit}
#spookky-app textarea::placeholder {color:var(--faint)}
#spookky-app .terminal-meta {margin-top:6px;color:var(--faint);font-size:11px;line-height:1.5;overflow-wrap:anywhere}
#spookky-app .cwd-note {font-size:11px;color:var(--muted);padding:6px 0;overflow-wrap:anywhere}
#spookky-app .cwd-note button {font-size:11px}
#spookky-app .cli-picker {border:1px solid var(--line);border-radius:6px;padding:8px;margin:12px 0}
#spookky-app .cli-picker>button {display:block;text-align:left;white-space:normal;font:inherit}
#spookky-app .resume-row {width:100%;display:block;white-space:normal}
#spookky-app .resume-row small {display:block;color:var(--muted);font-size:11px;margin-top:4px}
#spookky-app .files-sidebar {border-left:1px solid var(--line)}
#spookky-app .side-tabs {display:flex;height:36px;border-bottom:1px solid var(--line);flex:none;padding:0 8px;gap:12px}
#spookky-app .side-tabs button {position:relative;color:var(--muted);border-radius:0;padding:0 4px;gap:6px;font-size:12px}
#spookky-app .side-tabs button.active {color:var(--text)}
#spookky-app .side-tabs button.active::after {content:"";position:absolute;bottom:-1px;left:4px;right:4px;height:2px;background:var(--muted)}
#spookky-app .side-tabs svg {width:14px;height:14px}
#spookky-app .scope-path {font-size:11px;color:var(--faint);padding:10px 12px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}
#spookky-app .side-tools {display:flex;height:36px;align-items:center;gap:8px;margin:0 8px 4px;padding:0 4px;color:var(--faint);flex:none;border-bottom:1px solid var(--line)}
#spookky-app .side-tools svg {width:14px;height:14px}
#spookky-app .side-tools input {min-width:0;width:100%;border:0;background:none;padding:4px 0;font-size:12px}
#spookky-app .side-tools input::placeholder {color:var(--faint)}
#spookky-app .change-controls {display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px 0;font-size:11px}
#spookky-app .change-controls select {max-width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:4px 6px;font-size:11px}
#spookky-app .change-controls .hint {margin:2px 0;font-size:11px}
#spookky-app .file-tree {flex:1;min-height:0;overflow:auto;padding:0 6px 16px}
#spookky-app .folder-row {width:100%;height:28px;justify-content:flex-start;padding:4px 6px;color:var(--muted);font-size:11px;gap:5px}
#spookky-app .folder-row>span:first-of-type {min-width:0;overflow:hidden;text-overflow:ellipsis}
#spookky-app .folder-row svg {width:12px;height:12px}
#spookky-app .folder-row .count {margin-left:auto;color:var(--faint)}
#spookky-app .tree-file {width:100%;height:28px;justify-content:flex-start;gap:6px;padding:3px 6px 3px 22px;font-size:12px;border-radius:4px}
#spookky-app .tree-file.active {background:var(--selected)}
#spookky-app .tree-file>svg {width:14px;height:14px;color:var(--muted)}
#spookky-app .tree-file .name {overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1;text-align:left}
#spookky-app .tree-file .delta {font:11px ui-monospace,SFMono-Regular,Consolas,monospace;flex:none}
#spookky-app .empty-files {font-size:12px;color:var(--muted);padding:24px 12px;line-height:1.6;margin:0}
#spookky-app .file-head {min-height:32px;display:flex;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line);font-size:11px;color:var(--faint)}
#spookky-app .file-head .path {min-width:0;overflow-wrap:anywhere}
#spookky-app .diff-scroll {flex:1;min-width:0;overflow:auto}
#spookky-app .context-row {width:100%;height:28px;justify-content:flex-start;border-radius:0;padding:4px 12px;background:var(--surface);font-size:11px;color:var(--muted)}
#spookky-app .context-note {font-size:11px;padding:8px 12px;color:var(--muted)}
#spookky-app .code {font:12px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace}
#spookky-app .code-row {display:grid;grid-template-columns:30px 30px 14px minmax(0,1fr);min-height:22px;align-items:start}
#spookky-app .code-row.add {background:var(--add);box-shadow:inset 2px 0 var(--green)}
#spookky-app .code-row.del {background:var(--del);box-shadow:inset 2px 0 var(--red)}
#spookky-app .code-row .old,#spookky-app .code-row .new {color:var(--faint);text-align:right;padding-right:6px;user-select:none}
#spookky-app .code-row .sign {color:var(--faint)}
#spookky-app .code-row.add :is(.new,.sign) {color:var(--green)}
#spookky-app .code-row.del :is(.old,.sign) {color:var(--red)}
#spookky-app .code-row .source {white-space:pre-wrap;overflow-wrap:anywhere;padding-right:8px}
#spookky-app .kw {color:var(--blue)}
#spookky-app .str {color:var(--green)}
#spookky-app .code.split .code-pair {display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
#spookky-app .code.split .code-pair>:first-child {border-right:1px solid var(--line)}
#spookky-app .code.split .code-row {grid-template-columns:28px 12px minmax(0,1fr)}
#spookky-app .code.split .code-row .old {display:none}
#spookky-app .blank-tab {height:100%;min-height:0;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 28px}
#spookky-app .start-screen {width:560px;max-width:100%;margin:52px auto 24px}
#spookky-app .start-screen h2 {font-size:20px;font-weight:500;letter-spacing:-.4px;margin:0 0 24px;text-align:center}
#spookky-app .launch-composer {border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:3px;position:relative}
#spookky-app .launch-composer:focus-within {border-color:var(--faint)}
#spookky-app .composer-input {display:block;width:100%;min-height:80px;max-height:260px;padding:12px 12px 4px;background:none;border:0;border-radius:7px;color:var(--text);resize:none;overflow-y:auto;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#spookky-app .composer-footer {display:flex;align-items:center;gap:8px;padding:4px 6px;min-height:42px}
#spookky-app .composer-footer summary {padding:5px 6px;font-size:12px;gap:6px}
#spookky-app .composer-tool summary svg {width:14px;height:14px}
#spookky-app .composer-tool summary svg:last-child {width:12px;color:var(--faint)}
#spookky-app .composer-launch {width:30px;height:30px;border-radius:50%;padding:7px;background:var(--text);color:var(--bg)}
#spookky-app .composer-launch:hover {background:var(--muted)}
#spookky-app .terminal-launch {background:var(--selected);font-size:12px;padding:7px 10px;border-radius:6px}
#spookky-app .composer-context {display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:8px}
#spookky-app .composer-context summary {padding:5px 6px;font-size:12px;color:var(--muted);gap:5px;max-width:100%}
#spookky-app .composer-context summary>span {overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
#spookky-app .composer-context summary svg {width:13px;height:13px}
#spookky-app .composer-context>.start-menu {min-width:0;max-width:100%}
#spookky-app .composer-caption {display:flex;align-items:flex-start;gap:8px;justify-content:space-between;margin:4px 6px 0;font-size:11px;color:var(--faint);min-width:0}
#spookky-app .chosen-location,#spookky-app .inherited-folder {font:inherit;margin:0;min-width:0;overflow-wrap:anywhere}
#spookky-app .composer-help {flex:none;white-space:nowrap;font-size:11px}
#spookky-app .branch-caption {display:flex;align-items:center;flex-wrap:wrap;gap:4px;min-width:0;overflow-wrap:anywhere}
#spookky-app .branch-options {display:inline-block;font-size:11px}
#spookky-app .branch-options summary {padding:0 2px;font-size:11px;color:var(--muted)}

resizer.addEventListener('pointerup',e=>{if(resizer.hasPointerCapture(e.pointerId))resizer.releasePointerCapture(e.pointerId);persist()});resizer.addEventListener('click',e=>{if(dragged){e.stopPropagation();dragged=false}});
let wasWide=root.clientWidth>800,wasCompact=root.clientWidth<600;new ResizeObserver(()=>{const wide=root.clientWidth>800,compact=root.clientWidth<600;if(wide!==wasWide){wasWide=wide;capture();state.ui.nav=wide;if(!wide)state.ui.side=false;render()}else if(compact!==wasCompact){renderDiff();setupIcons()}wasCompact=compact}).observe(root);
restore(window.openai?.widgetState?.privateContent);render();
window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.privateContent;if(!validSnapshot(s)||(s.revision||0)<=(state.revision||0)||operation||dialog||root.contains(document.activeElement))return;restoring=true;restore(s);render();restoring=false});
})();
