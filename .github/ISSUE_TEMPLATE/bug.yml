name: Bug report
description: Report a reproducible problem in Spookky.
body:
  - type: markdown
    attributes:
      value: "Remove credentials, prompts, private paths, and terminal contents. Report vulnerabilities through Security, not this form."
  - type: input
    id: version
    attributes:
      label: App version or commit
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS version and architecture
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
